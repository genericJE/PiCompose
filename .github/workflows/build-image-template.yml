name: Build PiCompose (Template)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
        description: "Final image name"
      stage-list:
        required: true
        type: string
        description: "Comma or whitespace separated list of stages to execute"
      compression:
        required: false
        type: string
        default: "xz"
        description: "Compression to apply on final image (none, zip, xz, gz)"
      compression-level:
        required: false
        type: string
        default: "6"
        description: "Compression level 0-9"
      custom-hostname:
        required: false
        type: string
        default: "picompose"
        description: "Host name of the image"
      enable-rpi-imager-snippet:
        required: false
        type: boolean
        default: false
        description: "Enable rpi-imager.json snippet generation"

jobs:
  build_images:
    name: Build ${{ inputs.image-name }}
    runs-on: ubuntu-24.04-arm

# The build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Restore package cache
        uses: actions/cache@v4
        with:
          # Unpacking directly into /var/cache would result in permission errors
          # so we need to work around this a bit.
          path: apt-cache/
          key: ${{ runner.os }}-${{ github.job }}-${{ inputs.image-name }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}
            ${{ runner.os }}

      - name: Setup APT proxy on runner
        run: |
          mkdir -p apt-cache
          sudo apt-get install -y apt-cacher-ng --no-install-suggests --no-install-recommends
          sudo bash -c 'echo "Port: 9999" >> /etc/apt-cacher-ng/acng.conf'
          sudo mv -f apt-cache/* /var/cache/apt-cacher-ng/ || true
          sudo chown -R apt-cacher-ng:apt-cacher-ng /var/cache/apt-cacher-ng
          sudo service apt-cacher-ng restart

      # Only needed for 32bit build on x86_64 runner
      - name: Set up QEMU
        if: matrix.name == '32bit'
        uses: docker/setup-qemu-action@v3

      - name: Build Image with pi-gen
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          # APT proxy for caching
          apt-proxy: http://172.17.0.1:9999
          
          # Image configuration
          image-name: ${{ inputs.image-name }}
          hostname: ${{ inputs.custom-hostname }}
          username: pi
          password: raspberry
          
          # Stage list construction
          stage-list: ${{ inputs.stage-list }}
          
          # Build configuration
          release: trixie
          compression: ${{ inputs.compression }}
          compression-level: ${{ inputs.compression-level }}
          
          # Pi-gen settings
          pi-gen-repository: RPi-Distro/pi-gen
          pi-gen-version: arm64
          pi-gen-dir: pi-gen
          
          # Export settings
          export-last-stage-only: true
          
          # SSH and locale settings
          enable-ssh: 1
          locale: en_US.UTF-8
          keyboard-layout: English (US)
          keyboard-keymap: us
          timezone: Europe/London
          
          # Security settings
          disable-first-boot-user-rename: 0
          pubkey-only-ssh: 0
          pubkey-ssh-first-user: ''
          
          # Build options
          enable-noobs: false
          increase-runner-disk-size: false
          verbose-output: true
          
          # GitHub token
          github-token: ${{ github.token }}

      # Generate SHA256 checksums for image files
      - name: Generate SHA256 checksum, file_size and image_url
        id: sha256
        run: |
          IMAGE_PATH="${{ steps.build.outputs.image-path }}"

          # Determine if image-path is a file
          if [ -f "$IMAGE_PATH" ]; then
            # Calculate SHA256 hash and extract only the hash value
            SHA256_HASH=$(sha256sum "$IMAGE_PATH" | awk '{print $1}')

            # Get file size in bytes
            FILE_SIZE=$(stat -c%s "$IMAGE_PATH")

            # Write hash to sha256 file
            echo "${SHA256_HASH}  $(basename "$IMAGE_PATH")" > "${IMAGE_PATH}.sha256"

            # Set as GitHub Action outputs
            echo "sha256_hash=${SHA256_HASH}" >> $GITHUB_OUTPUT
            echo "file_size=${FILE_SIZE}" >> $GITHUB_OUTPUT
            echo "image_path=${IMAGE_PATH}" >> $GITHUB_OUTPUT
            echo "image_basename=$(basename "$IMAGE_PATH")" >> $GITHUB_OUTPUT

            echo "SHA256 checksum generated for: $IMAGE_PATH"
            echo "SHA256 hash: $SHA256_HASH"
            echo "File size: $FILE_SIZE bytes"
          else
            echo "::warning::Image path not found: $IMAGE_PATH"
          fi

      # Generate a single-image rpi-imager.json so the user can load this
      # specific build directly via "Use custom image" / repo URL in Pi Imager.
      # Only runs when the build job opts in via enable-rpi-imager-snippet.
      - name: Generate single-image rpi-imager.json
        if: inputs.enable-rpi-imager-snippet && steps.sha256.outputs.image_path != ''
        id: imager-json
        run: |
          IMAGE_PATH="${{ steps.sha256.outputs.image_path }}"
          BASENAME="${{ steps.sha256.outputs.image_basename }}"
          DOWNLOAD_SIZE="${{ steps.sha256.outputs.file_size }}"

          REF_NAME="${{ github.ref_name }}"
          REF_ENCODED="${REF_NAME//\//%2F}"
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/${REF_ENCODED}/${BASENAME}"

          # Pi Imager validates the decompressed image, not the .xz wrapper,
          # so the published sha256 must be of the underlying .img.
          if [[ "$BASENAME" == *.xz ]]; then
            EXTRACT_SHA256=$(xzcat "$IMAGE_PATH" | sha256sum | awk '{print $1}')
            EXTRACT_SIZE=$(xz --list --robot "$IMAGE_PATH" | awk '/^totals/ {print $5}')
          elif [[ "$BASENAME" == *.zip ]]; then
            EXTRACT_SHA256=$(unzip -p "$IMAGE_PATH" | sha256sum | awk '{print $1}')
            EXTRACT_SIZE=$(unzip -l "$IMAGE_PATH" | awk '/[0-9]+ +[0-9-]+ +[0-9:]+ +.+\.img$/ {print $1}' | head -1)
          else
            EXTRACT_SHA256="$(sha256sum "$IMAGE_PATH" | awk '{print $1}')"
            EXTRACT_SIZE="$DOWNLOAD_SIZE"
          fi

          OS_NAME="${{ inputs.image-name }}"
          # raw.githubusercontent.com handles slashes in refs natively, so
          # we keep REF_NAME un-encoded here even though the releases URL
          # above needs the %2F form.
          ICON_URL="https://raw.githubusercontent.com/${{ github.repository }}/${REF_NAME}/docs/respeaker_2michats.webp"

          cat > rpi-imager.json <<JSON
          {
            "imager": {
              "latest_version": "${REF_NAME}",
              "url": "https://www.raspberrypi.com/software/",
              "devices": [
                {"name": "Raspberry Pi 5", "tags": ["pi5-64bit", "pi5-32bit"], "default": true, "icon": "https://downloads.raspberrypi.com/imager/icons/RPi_5.png", "description": "Raspberry Pi 5, 500 / 500+, and Compute Module 5", "matching_type": "exclusive", "capabilities": []},
                {"name": "Raspberry Pi 4", "tags": ["pi4-64bit", "pi4-32bit"], "icon": "https://downloads.raspberrypi.com/imager/icons/RPi_4.png", "description": "Raspberry Pi 4 Model B, 400, and Compute Module 4 / 4S", "matching_type": "inclusive", "capabilities": []},
                {"name": "Raspberry Pi 3", "tags": ["pi3-64bit", "pi3-32bit"], "icon": "https://downloads.raspberrypi.com/imager/icons/RPi_3.png", "description": "Raspberry Pi 3 Model A+ / B / B+ and Compute Module 3 / 3+", "matching_type": "inclusive", "capabilities": []},
                {"name": "Raspberry Pi Zero 2 W", "tags": ["pi3-64bit", "pi3-32bit"], "icon": "https://downloads.raspberrypi.com/imager/icons/RPi_Zero_2_W.png", "description": "Raspberry Pi Zero 2 W", "matching_type": "inclusive", "capabilities": []}
              ]
            },
            "os_list": [
              {
                "name": "${OS_NAME} (${REF_NAME})",
                "description": "PiCompose image: 2-Mic HAT v2 + Linux Voice Assistant from feat/peripheral-led-light-entity (Light entity + Rainbow effect, ReSpeaker 2-Mic peripheral). Built ${{ github.sha }} on branch ${REF_NAME}.",
                "icon": "${ICON_URL}",
                "url": "${IMAGE_URL}",
                "init_format": "systemd",
                "image_download_size": ${DOWNLOAD_SIZE},
                "extract_size": ${EXTRACT_SIZE},
                "extract_sha256": "${EXTRACT_SHA256}",
                "devices": ["pi5-64bit", "pi4-64bit", "pi3-64bit"],
                "capabilities": ["ssh", "wifi", "hostname", "locale"]
              }
            ]
          }
          JSON

          echo "rpi-imager.json:"
          cat rpi-imager.json
          echo "imager_json_path=$(pwd)/rpi-imager.json" >> $GITHUB_OUTPUT

      # Build the image URL for releases
      - name: Build image URL
        id: image-url
        run: |
          # Get current date in YYYY-MM-DD format
          DATE=$(date +%Y-%m-%d)

          # URL-encode the ref name (replace / with %2F)
          REF_NAME="${{ github.ref_name }}"
          REF_ENCODED="${REF_NAME//\//%2F}"

          # Build the filename
          FILENAME="image_${DATE}-${{ inputs.image-name }}.zip"

          # Build the full URL
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/${REF_ENCODED}/${FILENAME}"

          # Set as GitHub Action output
          echo "url=${IMAGE_URL}" >> $GITHUB_OUTPUT

          echo "Image URL: $IMAGE_URL"

      # Create Release for Tags
      - name: Create Release for Tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
          fail_on_unmatched_files: false
          files: |
            ${{ steps.build.outputs.image-path }}
            ${{ steps.build.outputs.image-path }}.sha256
            rpi-imager.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create Release for Branches
      - name: Create Release for Branches
        if: '!startsWith(github.ref, ''refs/tags/'')'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          draft: false
          fail_on_unmatched_files: false
          files: |
            ${{ steps.build.outputs.image-path }}
            ${{ steps.build.outputs.image-path }}.sha256
            rpi-imager.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Save APT cache for future builds
      - name: Move packages to temp location for caching
        run: |
          mkdir -p apt-cache
          if [ -d "/var/cache/apt-cacher-ng" ]; then
            if [ "$(ls -A /var/cache/apt-cacher-ng)" ]; then
              sudo rm -rf apt-cache/*
              sudo mv -f /var/cache/apt-cacher-ng/* apt-cache/
              echo "APT-Cacher-NG cache was successfully saved."
            else
              echo "::warning::The directory /var/cache/apt-cacher-ng/ exists but is empty. No cache available to save."
            fi
          else
            echo "::warning::The directory /var/cache/apt-cacher-ng/ does not exist. APT-Cacher-NG might not be correctly installed or configured."
          fi
          
          # Output of logfile for debugging
          if [ -f "/var/log/apt-cacher-ng/apt-cacher.log" ]; then
            echo "Contents of the APT-Cacher-NG logfile:"
            cat /var/log/apt-cacher-ng/apt-cacher.log
          else
            echo "::warning::The logfile /var/log/apt-cacher-ng/apt-cacher.log does not exist."
          fi
